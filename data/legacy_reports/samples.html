<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Samples</title>
    <style>
        body {
            background-color: #0b0f19; /* Dark background matching the site */
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            gap: 40px;
        }

        .sample-container {
            text-align: center;
            width: 200px;
        }

        .glass-container {
            position: relative;
            width: 200px;
            aspect-ratio: 3/4;
            margin-bottom: 20px;
        }

        .glow-blob {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            filter: blur(30px);
            opacity: 0.7;
            z-index: 0;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }

        /* 1. Vibrant Multi-color */
        .glow-multi {
            background: radial-gradient(circle at 30% 30%, #00aeef, transparent 50%),
                        radial-gradient(circle at 70% 70%, #9b51e0, transparent 50%),
                        radial-gradient(circle at 50% 50%, #ff007f, transparent 50%);
        }

        /* 2. Soft Warm Glow */
        .glow-warm {
            background: radial-gradient(circle at 50% 50%, #ff8a00, transparent 60%),
                        radial-gradient(circle at 20% 80%, #e52e71, transparent 50%);
        }

        /* 3. Elegant Monochromatic */
        .glow-mono {
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.8), transparent 60%),
                        radial-gradient(circle at 20% 20%, rgba(200,200,255,0.5), transparent 50%);
        }

        /* 4. Cyberpunk Neon */
        .glow-cyber {
            background: radial-gradient(circle at 20% 50%, #00f3ff, transparent 60%),
                        radial-gradient(circle at 80% 50%, #ff00ff, transparent 60%);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 100px 100px 16px 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <div class="sample-container">
        <div class="glass-container">
            <div class="glow-blob glow-multi"></div>
            <div class="image-wrapper"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=400&q=80" alt="Person"></div>
        </div>
        <h3>1. Multi-color</h3>
        <p style="font-size: 12px; color: #888;">Blue, Purple, Pink</p>
    </div>

    <div class="sample-container">
        <div class="glass-container">
            <div class="glow-blob glow-warm"></div>
            <div class="image-wrapper"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=400&q=80" alt="Person"></div>
        </div>
        <h3>2. Warm Glow</h3>
        <p style="font-size: 12px; color: #888;">Amber, Gold, Soft Pink</p>
    </div>

    <div class="sample-container">
        <div class="glass-container">
            <div class="glow-blob glow-mono"></div>
            <div class="image-wrapper"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=400&q=80" alt="Person"></div>
        </div>
        <h3>3. Monochromatic</h3>
        <p style="font-size: 12px; color: #888;">Soft White, Silver</p>
    </div>

    <div class="sample-container">
        <div class="glass-container">
            <div class="glow-blob glow-cyber"></div>
            <div class="image-wrapper"><img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?fit=crop&w=400&q=80" alt="Person"></div>
        </div>
        <h3>4. Cyberpunk</h3>
        <p style="font-size: 12px; color: #888;">Neon Cyan & Magenta</p>
    </div>

</body>
</html>
